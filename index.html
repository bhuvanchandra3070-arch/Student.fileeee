<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<header>
<h1>Student Management System</h1>
<p>Java • Spring Boot • JDBC • MySQL</p>
</header>

<section class="card">
<h2>Add / Update Student</h2>
<form id="studentForm">
<input type="hidden" id="studentId">

<label for="name">Student Name</label>
<input type="text" id="name" maxlength="100" placeholder="Enter student name" required>

<label for="email">Email</label>
<input type="email" id="email" maxlength="150" placeholder="Enter email" required>

<div class="buttons">
<button type="submit" id="submitButton" class="primary">Add Student</button>
<button type="button" id="cancelButton" class="secondary" style="display:none">Cancel</button>
</div>
</form>
<div id="message" class="message"></div>
</section>

<section class="card">
<div class="table-header">
<h2>Students</h2>
<button class="secondary" onclick="loadStudents()">Refresh</button>
</div>
<div class="table-container">
<table>
<thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Actions</th></tr></thead>
<tbody id="studentTableBody"></tbody>
</table>
</div>
</section>
</div>
<script src="script.js"></script>
</body>
</html>
